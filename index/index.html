<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フルーツ鬼ごっこ！〜食べ物大脱走〜</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            color: #ff6b81;
            text-shadow: 2px 2px #ff4757;
            text-align: center;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #ff4757;
            background: #2f3542;
        }
        canvas {
            display: block;
            background: #7bed9f;
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 100%;
            padding: 10px 15px;
            background: rgba(0,0,0,0.4);
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .stat-item span {
            color: #ffa502;
        }
        /* オーバーレイ画面 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        .overlay h2 {
            font-size: 2.3rem;
            color: #ff4757;
            margin-bottom: 10px;
        }
        .overlay p {
            font-size: 1rem;
            max-width: 550px;
            line-height: 1.5;
            margin-bottom: 15px;
            color: #dfe4ea;
        }
        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            margin: 5px;
        }
        .btn:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }
        .character-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            max-width: 500px;
        }
        .char-card {
            background: rgba(255,255,255,0.1);
            border: 3px solid transparent;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .char-card.selected {
            border-color: #ffa502;
            background: rgba(255,165,2,0.2);
            transform: translateY(-3px);
        }
        .char-card h3 {
            margin: 3px 0;
            color: #ffa502;
            font-size: 1.1rem;
        }
        .char-card p {
            font-size: 0.75rem;
            margin: 3px 0 0 0;
            color: #ced6e0;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #a4b0be;
            text-align: center;
        }
        /* スマホ用コントローラー */
        .touch-controls {
            display: none;
            width: 800px;
            max-width: 100%;
            justify-content: space-between;
            margin-top: 10px;
            padding: 0 10px;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 2px;
        }
        .d-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .action-btn {
            background: #ff4757;
            border: none;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        @media (max-width: 850px) {
            .touch-controls { display: flex; }
        }
    </style>
</head>
<body>

    <h1>🍓 フルーツ鬼ごっこ！ 🍇</h1>
    
    <div class="ui-panel">
        <div class="stat-item">生存時間: <span id="time-display">0</span>秒</div>
        <div class="stat-item">スコア: <span id="score-display">0</span></div>
        <div class="stat-item">スキルクールダウン: <span id="skill-cd">OK!</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- スタート画面 -->
        <div id="start-screen" class="overlay">
            <h2>フルーツ大脱走！</h2>
            <p>キャラクターを選んで鬼から逃げろ！スキルを駆使して生き延びよう！</p>
            
            <div class="character-select">
                <div class="char-card selected" data-char="strawberry">
                    <h3>🍓 イチゴ</h3>
                    <p><b>攻撃:</b> 種飛ばし<br><b>防御:</b> ヘタ盾防御</p>
                </div>
                <div class="char-card" data-char="grape">
                    <h3>🍇 ブドウ</h3>
                    <p><b>スキル:</b> 分身バラバラ＆合体</p>
                </div>
                <div class="char-card" data-char="watermelon">
                    <h3>🍉 スイカ</h3>
                    <p><b>攻撃:</b> 種地雷設置<br><b>防御:</b> 頑丈な皮</p>
                </div>
                <div class="char-card" data-char="banana">
                    <h3>🍌 バナナ</h3>
                    <p><b>攻撃:</b> バナナの皮トラップ<br><b>防御:</b> スピードダッシュ</p>
                </div>
            </div>

            <button class="btn" id="start-btn">ゲームスタート！</button>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover-screen" class="overlay" style="display: none;">
            <h2>食べられちゃった…！</h2>
            <p id="result-text">よく頑張りました！</p>
            <button class="btn" id="restart-btn">もう一度プレイ</button>
        </div>
    </div>

    <div class="controls-hint">
        [ 矢印キー または WASD ] 移動 ｜ [ SPACEキー ] スキル発動
    </div>

    <!-- スマホ用コントローラー -->
    <div class="touch-controls">
        <div class="d-pad">
            <div></div><button class="d-btn" id="btn-up">▲</button><div></div>
            <button class="d-btn" id="btn-left">◀</button><div></div><button class="d-btn" id="btn-right">▶</button>
            <div></div><button class="d-btn" id="btn-down">▼</button><div></div>
        </div>
        <div class="action-btns">
            <button class="action-btn" id="btn-skill">スキル</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const timeDisplay = document.getElementById('time-display');
const scoreDisplay = document.getElementById('score-display');
const skillCdDisplay = document.getElementById('skill-cd');
const resultText = document.getElementById('result-text');

let selectedChar = 'strawberry';
document.querySelectorAll('.char-card').forEach(card => {
    card.addEventListener('click', () => {
        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedChar = card.getAttribute('data-char');
    });
});

let gameState = 'START';
let gameTime = 0;
let score = 0;
let timerInterval = null;
let keys = {};

let player = {
    x: 400,
    y: 250,
    radius: 20,
    speed: 4,
    skillCdTimer: 0,
    isShielding: false,
    shieldTimer: 0,
    isSplit: false,
    splitTimer: 0,
    clones: []
};

let oni = {
    x: 100,
    y: 100,
    radius: 24,
    speed: 2.5,
    stunTimer: 0
};

let seeds = [];
let traps = [];
let items = [];

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' && gameState === 'PLAYING') {
        e.preventDefault();
        useSkill();
    }
});
window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

function setupTouchBtn(id, code) {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
    el.addEventListener('mousedown', () => { keys[code] = true; });
    el.addEventListener('mouseup', () => { keys[code] = false; });
}
setupTouchBtn('btn-up', 'ArrowUp');
setupTouchBtn('btn-down', 'ArrowDown');
setupTouchBtn('btn-left', 'ArrowLeft');
setupTouchBtn('btn-right', 'ArrowRight');
document.getElementById('btn-skill').addEventListener('click', () => {
    if (gameState === 'PLAYING') useSkill();
});

// スキル発動
function useSkill() {
    if (player.skillCdTimer > 0) return;

    if (selectedChar === 'strawberry') {
        player.isShielding = true;
        player.shieldTimer = 90;
        for (let i = -1; i <= 1; i++) {
            let angle = Math.atan2(oni.y - player.y, oni.x - player.x) + (i * 0.3);
            seeds.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7, radius: 5 });
        }
        player.skillCdTimer = 240;

    } else if (selectedChar === 'grape') {
        player.isSplit = true;
        player.splitTimer = 180;
        player.clones = [];
        for (let i = 0; i < 4; i++) {
            let angle = (Math.PI * 2 / 4) * i;
            player.clones.push({ x: player.x + Math.cos(angle) * 40, y: player.y + Math.sin(angle) * 40, angleOffset: angle });
        }
        player.skillCdTimer = 300;

    } else if (selectedChar === 'watermelon') {
        // スイカ：重い一撃＆種地雷をその場に置く
        player.isShielding = true;
        player.shieldTimer = 120; // 頑丈な皮（無敵＆速い）
        traps.push({ x: player.x, y: player.y, radius: 15, type: 'watermelon_seed' });
        player.skillCdTimer = 270;

    } else if (selectedChar === 'banana') {
        // バナナ：バナナの皮トラップを設置 ＋ ダッシュ
        traps.push({ x: player.x, y: player.y, radius: 14, type: 'banana_peel' });
        player.speed = 7;
        setTimeout(() => { player.speed = 4; }, 1500); // 1.5秒間スピードアップ
        player.skillCdTimer = 200;
    }
}

startBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    initGame();
});

restartBtn.addEventListener('click', () => {
    gameoverScreen.style.display = 'none';
    initGame();
});

function initGame() {
    gameState = 'PLAYING';
    gameTime = 0;
    score = 0;
    player.x = 400;
    player.y = 250;
    player.speed = 4;
    player.skillCdTimer = 0;
    player.isShielding = false;
    player.shieldTimer = 0;
    player.isSplit = false;
    player.splitTimer = 0;
    player.clones = [];
    
    oni.x = 100;
    oni.y = 100;
    oni.stunTimer = 0;
    oni.speed = 2.5;

    seeds = [];
    traps = [];
    items = [];
    spawnItem();
    spawnItem();

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameState === 'PLAYING') {
            gameTime++;
            score += 10;
            timeDisplay.textContent = gameTime;
            scoreDisplay.textContent = score;

            if (gameTime % 10 === 0 && oni.speed < 5.0) {
                oni.speed += 0.1;
            }
            if (Math.random() < 0.4) {
                spawnItem();
            }
        }
    }, 1000);
}

function spawnItem() {
    items.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: Math.random() * (canvas.height - 60) + 30,
        radius: 12,
        type: Math.random() < 0.2 ? 'star' : 'sugar'
    });
}

function update() {
    if (gameState !== 'PLAYING') return;

    let moveX = 0;
    let moveY = 0;
    if (keys['ArrowUp'] || keys['KeyW']) moveY -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) moveY += 1;
    if (keys['ArrowLeft'] || keys['KeyA']) moveX -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) moveX += 1;

    if (moveX !== 0 && moveY !== 0) {
        moveX *= 0.7071;
        moveY *= 0.7071;
    }

    player.x += moveX * player.speed;
    player.y += moveY * player.speed;

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    if (player.skillCdTimer > 0) player.skillCdTimer--;
    
    if (player.isShielding) {
        player.shieldTimer--;
        if (player.shieldTimer <= 0) player.isShielding = false;
    }

    if (player.isSplit) {
        player.splitTimer--;
        player.clones.forEach((clone) => {
            clone.angleOffset += 0.08;
            clone.x = player.x + Math.cos(clone.angleOffset) * 50;
            clone.y = player.y + Math.sin(clone.angleOffset) * 50;
        });
        if (player.splitTimer <= 0) player.isSplit = false;
    }

    if (player.skillCdTimer <= 0) {
        skillCdDisplay.textContent = 'OK! [SPACE]';
        skillCdDisplay.style.color = '#7bed9f';
    } else {
        skillCdDisplay.textContent = (player.skillCdTimer / 60).toFixed(1) + '秒';
        skillCdDisplay.style.color = '#ffa502';
    }

    // 鬼のAI
    let targetX = player.x;
    let targetY = player.y;
    if (player.isSplit && player.clones.length > 0 && Math.random() < 0.3) {
        let randomClone = player.clones[Math.floor(Math.random() * player.clones.length)];
        targetX = randomClone.x;
        targetY = randomClone.y;
    }

    let angleToPlayer = Math.atan2(targetY - oni.y, targetX - oni.x);
    let currentOniSpeed = oni.speed;
    if (oni.stunTimer > 0) {
        oni.stunTimer--;
        currentOniSpeed *= 0.3;
    }

    oni.x += Math.cos(angleToPlayer) * currentOniSpeed;
    oni.y += Math.sin(angleToPlayer) * currentOniSpeed;

    // トラップ（バナナの皮・スイカの種地雷）判定
    for (let i = traps.length - 1; i >= 0; i--) {
        let t = traps[i];
        let distOni = Math.hypot(t.x - oni.x, t.y - oni.y);
        if (distOni < oni.radius + t.radius) {
            oni.stunTimer = t.type === 'banana_peel' ? 120 : 90; // バナナは長く転ぶ
            traps.splice(i, 1);
            score += 40;
        }
    }

    // 種（攻撃）判定
    for (let i = seeds.length - 1; i >= 0; i--) {
        let s = seeds[i];
        s.x += s.vx;
        s.y += s.vy;

        let distOni = Math.hypot(s.x - oni.x, s.y - oni.y);
        if (distOni < oni.radius + s.radius) {
            oni.stunTimer = 60;
            seeds.splice(i, 1);
            score += 50;
            continue;
        }
        if (s.x < 0 || s.x > canvas.width || s.y < 0 || s.y > canvas.height) {
            seeds.splice(i, 1);
        }
    }

    // アイテム回収
    for (let i = items.length - 1; i >= 0; i--) {
        let itm = items[i];
        let dist = Math.hypot(player.x - itm.x, player.y - itm.y);
        if (dist < player.radius + itm.radius) {
            score += itm.type === 'star' ? 300 : 100;
            items.splice(i, 1);
        }
    }

    // 当たり判定
    let distPlayerOni = Math.hypot(player.x - oni.x, player.y - oni.y);
    if (distPlayerOni < player.radius + oni.radius) {
        if (player.isShielding) {
            oni.x -= Math.cos(angleToPlayer) * 60;
            oni.y -= Math.sin(angleToPlayer) * 60;
        } else if (!player.isSplit) {
            gameOver();
        }
    }
}

function gameOver() {
    gameState = 'GAMEOVER';
    clearInterval(timerInterval);
    resultText.innerHTML = `生存時間: <b>${gameTime}</b> 秒<br>最終スコア: <b>${score}</b> 点`;
    gameoverScreen.style.display = 'flex';
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景グリッド
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // トラップ描画
    traps.forEach(t => {
        ctx.save();
        ctx.translate(t.x, t.y);
        if (t.type === 'banana_peel') {
            ctx.fillStyle = '#f1c40f';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🍌', 0, 8);
        } else {
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    });

    // アイテム
    items.forEach(itm => {
        ctx.beginPath();
        ctx.arc(itm.x, itm.y, itm.radius, 0, Math.PI * 2);
        ctx.fillStyle = itm.type === 'star' ? '#f1c40f' : '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#d35400';
        ctx.lineWidth = 2;
        ctx.stroke();
    });

    // 種
    seeds.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e74c3c';
        ctx.fill();
    });

    // 鬼
    ctx.save();
    ctx.translate(oni.x, oni.y);
    ctx.beginPath();
    ctx.arc(0, 0, oni.radius, 0, Math.PI * 2);
    ctx.fillStyle = oni.stunTimer > 0 ? '#3498db' : '#e67e22';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#d35400';
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.fillRect(-12, -oni.radius - 16, 24, 16);
    ctx.beginPath();
    ctx.arc(0, -oni.radius - 16, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🍴', 0, 6);
    ctx.restore();

    // プレイヤー描画
    if (selectedChar === 'strawberry') {
        drawStrawberry(player.x, player.y, player.radius, player.isShielding);
    } else if (selectedChar === 'grape') {
        if (player.isSplit) {
            player.clones.forEach(clone => {
                drawGrape(clone.x, clone.y, player.radius * 0.8, true);
            });
        }
        drawGrape(player.x, player.y, player.radius, player.isSplit);
    } else if (selectedChar === 'watermelon') {
        drawWatermelon(player.x, player.y, player.radius + 4, player.isShielding);
    } else if (selectedChar === 'banana') {
        drawBanana(player.x, player.y, player.radius);
    }

    requestAnimationFrame(gameLoop);
}

function drawStrawberry(x, y, radius, isShielding) {
    ctx.save();
    ctx.translate(x, y);
    if (isShielding) {
        ctx.beginPath(); ctx.arc(0, 0, radius + 12, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(46, 204, 113, 0.4)'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#2ecc71'; ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(0, radius);
    ctx.bezierCurveTo(-radius, radius * 0.5, -radius, -radius * 0.5, 0, -radius);
    ctx.bezierCurveTo(radius, -radius * 0.5, radius, radius * 0.5, 0, radius);
    ctx.fillStyle = '#ff4757'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#c0392b'; ctx.stroke();
    ctx.fillStyle = '#f1c40f';
    for (let i = -1; i <= 1; i++) {
        ctx.fillRect(i * 6, -5, 3, 3); ctx.fillRect(i * 8, 5, 3, 3);
    }
    ctx.fillStyle = '#2ed573';
    ctx.beginPath(); ctx.moveTo(0, -radius); ctx.lineTo(-10, -radius - 8); ctx.lineTo(-3, -radius - 3); ctx.lineTo(0, -radius - 10); ctx.lineTo(3, -radius - 3); ctx.lineTo(10, -radius - 8); ctx.closePath(); ctx.fill();
    ctx.restore();
}

function drawGrape(x, y, radius, isGhost) {
    ctx.save();
    ctx.translate(x, y);
    if (isGhost) ctx.globalAlpha = 0.6;
    const offsets = [
        {ox: 0, oy: -8}, {ox: -8, oy: 0}, {ox: 8, oy: 0},
        {ox: -14, oy: 8}, {ox: 0, oy: 8}, {ox: 14, oy: 8},
        {ox: -6, oy: 16}, {ox: 6, oy: 16}
    ];
    offsets.forEach(o => {
        ctx.beginPath(); ctx.arc(o.ox, o.oy, radius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = '#9b59b6'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#8e44ad'; ctx.stroke();
    });
    ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, -20); ctx.stroke();
    ctx.restore();
}

function drawWatermelon(x, y, radius, isShielding) {
    ctx.save();
    ctx.translate(x, y);
    if (isShielding) {
        ctx.beginPath(); ctx.arc(0, 0, radius + 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(52, 152, 219, 0.4)'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#3498db'; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#2ecc71'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#27ae60'; ctx.stroke();
    // 縞模様
    ctx.strokeStyle = '#1e8449'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, radius, -Math.PI*0.3, Math.PI*0.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, radius, Math.PI*0.7, Math.PI*1.3); ctx.stroke();
    ctx.restore();
}

function drawBanana(x, y, radius) {
    ctx.save();
    ctx.translate(x, y);
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍌', 0, 0);
    ctx.restore();
}

function gameLoop() {
    update();
    draw();
}

draw();
</script>
