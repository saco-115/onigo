<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>フルーツ鬼ごっこ！〜スワイプ＆スキルボタン改良版〜</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            margin: 0; padding: 0; background: #1a1a2e;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; overflow: hidden;
        }
        h1 { margin: 5px 0; font-size: 1.4rem; color: #ff6b81; text-shadow: 2px 2px #ff4757; text-align: center; }
        
        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 0 10px;
        }
        
        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 6px 10px;
            background: rgba(0,0,0,0.5);
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 4px;
        }
        .stat-item span { color: #ffa502; }
        .coin-display { color: #f1c40f !important; }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #ff4757;
            background: #2f3542;
            width: 100%;
            aspect-ratio: 16 / 10;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #7bed9f;
            outline: none;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 10; text-align: center; padding: 15px;
            overflow-y: auto;
        }
        .overlay h2 { font-size: 1.8rem; color: #ff4757; margin: 5px 0 10px 0; }
        .overlay p { font-size: 0.9rem; max-width: 500px; line-height: 1.4; margin-bottom: 12px; color: #dfe4ea; }

        .btn {
            background: #ff4757; color: white; border: none; padding: 10px 22px;
            font-size: 1rem; font-weight: bold; border-radius: 30px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); margin: 4px;
        }
        .btn:hover { background: #ff6b81; transform: scale(1.05); }
        .btn-gacha {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
        }
        .btn-zukan {
            background: linear-gradient(135deg, #3498db, #2980b9);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }

        .character-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 450px;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px;
        }
        .char-card {
            background: rgba(255,255,255,0.1);
            border: 3px solid transparent;
            border-radius: 10px;
            padding: 6px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .char-card.selected { border-color: #ffa502; background: rgba(255,165,2,0.2); }
        .char-card.locked { opacity: 0.5; filter: grayscale(0.8); cursor: not-allowed; }
        .char-card h3 { margin: 2px 0; color: #ffa502; font-size: 0.95rem; }
        .char-card p { font-size: 0.65rem; margin: 2px 0 0 0; color: #ced6e0; }

        #zukan-screen { display: none; }
        .zukan-tabs {
            display: flex; gap: 10px; margin-bottom: 10px;
        }
        .tab-btn {
            background: #2f3542; color: #fff; border: 2px solid #718093;
            padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background: #ff4757; border-color: #ff6b81; }
        .zukan-list {
            display: grid; grid-template-columns: 1fr; gap: 8px;
            width: 100%; max-width: 450px; max-height: 220px; overflow-y: auto; padding: 4px; text-align: left;
        }
        .zukan-item {
            background: rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 12px; border-left: 4px solid #ff4757;
        }
        .zukan-item h4 { margin: 0 0 4px 0; color: #ffa502; font-size: 1rem; }
        .zukan-item p { margin: 0; font-size: 0.75rem; color: #dfe4ea; line-height: 1.3; }

        #gacha-screen { display: none; }
        .gacha-box {
            background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; margin-bottom: 12px; width: 100%; max-width: 400px; border: 2px dashed #f1c40f;
        }
        #gacha-result { font-size: 1.1rem; color: #f1c40f; font-weight: bold; margin: 8px 0; min-height: 35px; }

        .bottom-control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 6px;
            padding: 0 4px;
        }
        .controls-hint {
            font-size: 0.8rem; color: #a4b0be; text-align: left;
        }
        .skill-button {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            outline: none;
        }
        .skill-button:active { transform: scale(0.92); background: #ff3838; }
        .menu-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <h1>🍓 フルーツ鬼ごっこ！ 🍇</h1>
        
        <div class="ui-panel">
            <div class="stat-item">生存時間: <span id="time-display">0</span>秒</div>
            <div class="stat-item">スコア: <span id="score-display">0</span></div>
            <div class="stat-item coin-display">コイン: <span id="coin-display">0</span>枚</div>
            <div class="stat-item">スキル: <span id="skill-cd">OK!</span></div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="500" tabindex="1"></canvas>

            <div id="start-screen" class="overlay">
                <h2>フルーツ大脱走！</h2>
                <p>画面をスライドして移動！下のスキルボタンでいつでも技が発動できるよ！</p>
                <div class="character-select" id="char-select-grid"></div>
                <div class="menu-btns">
                    <button class="btn" id="start-btn">ゲームスタート！</button>
                    <button class="btn btn-gacha" id="open-gacha-btn">🎁 ガチャ (100枚)</button>
                    <button class="btn btn-zukan" id="open-zukan-btn">📖 図鑑</button>
                </div>
            </div>

            <div id="zukan-screen" class="overlay">
                <h2>キャラクター図鑑</h2>
                <div class="zukan-tabs">
                    <button class="tab-btn active" id="tab-ally">味方キャラ</button>
                    <button class="tab-btn" id="tab-enemy">敵キャラ</button>
                </div>
                <div class="zukan-list" id="zukan-content-list"></div>
                <button class="btn" id="close-zukan-btn" style="background: #718093; margin-top: 10px;">もどる</button>
            </div>

            <div id="gacha-screen" class="overlay" style="display: none;">
                <h2>フルーツガチャ</h2>
                <div class="gacha-box">
                    <p>1回 100コインで新しいフルーツをゲット！</p>
                    <div id="gacha-result">何が出るかな…？</div>
                </div>
                <button class="btn btn-gacha" id="spin-gacha-btn">ガチャをまわす！</button>
                <button class="btn" id="close-gacha-btn" style="background: #718093; margin-top: 10px;">もどる</button>
            </div>

            <div id="gameover-screen" class="overlay" style="display: none;">
                <h2>食べられちゃった…！</h2>
                <p id="result-text">よく頑張りました！</p>
                <div class="menu-btns">
                    <button class="btn" id="restart-btn">もう一度プレイ</button>
                    <button class="btn btn-gacha" id="gameover-gacha-btn">🎁 ガチャ</button>
                    <button class="btn btn-zukan" id="gameover-zukan-btn">📖 図鑑</button>
                </div>
            </div>
        </div>

        <div class="bottom-control-bar">
            <div class="controls-hint">
                💡 指で画面をスライドして移動！<br>
                右下の<b>【スキル】ボタン</b>でいつでも発動！
            </div>
            <button class="skill-button" id="mobile-skill-btn">
                スキル<br>[ ⚡ ]
            </button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const startScreen = document.getElementById('start-screen');
const zukanScreen = document.getElementById('zukan-screen');
const gachaScreen = document.getElementById('gacha-screen');
const gameoverScreen = document.getElementById('gameover-screen');

const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const openGachaBtn = document.getElementById('open-gacha-btn');
const closeGachaBtn = document.getElementById('close-gacha-btn');
const spinGachaBtn = document.getElementById('spin-gacha-btn');
const gameOverGachaBtn = document.getElementById('gameover-gacha-btn');
const openZukanBtn = document.getElementById('open-zukan-btn');
const closeZukanBtn = document.getElementById('close-zukan-btn');
const gameOverZukanBtn = document.getElementById('gameover-zukan-btn');
const tabAlly = document.getElementById('tab-ally');
const tabEnemy = document.getElementById('tab-enemy');
const mobileSkillBtn = document.getElementById('mobile-skill-btn');

const timeDisplay = document.getElementById('time-display');
const scoreDisplay = document.getElementById('score-display');
const coinDisplay = document.getElementById('coin-display');
const skillCdDisplay = document.getElementById('skill-cd');
const resultText = document.getElementById('result-text');
const gachaResult = document.getElementById('gacha-result');
const charSelectGrid = document.getElementById('char-select-grid');
const zukanContentList = document.getElementById('zukan-content-list');

let saveData = JSON.parse(localStorage.getItem('fruit_tag_save')) || {
    coins: 50,
    unlocked: ['strawberry']
};

function saveGame() {
    localStorage.setItem('fruit_tag_save', JSON.stringify(saveData));
}

const allyCharacters = {
    strawberry: { name: '🍓 イチゴ', desc: '攻撃: 種飛ばし / 防御: ヘタ盾', detail: '甘酸っぱい正義の味方。ピンチの時はヘタの盾で鬼を弾き返す！' },
    grape: { name: '🍇 ブドウ', desc: 'スキル: 分身バラバラ＆合体', detail: '粒がバラバラに分身して鬼を盛大に惑わせるトリッキーなファイター。' },
    watermelon: { name: '🍉 スイカ', desc: '攻撃: 種地雷 / 防御: 頑丈な皮', detail: '硬い皮と重い体躯が自慢のタンク役。地雷で鬼の足止めをする。' },
    banana: { name: '🍌 バナナ', desc: '攻撃: 皮トラップ / 防御: ダッシュ', detail: '驚異的な俊足とバナナの皮トラップで鬼を派手に転ばせる。' },
    melon: { name: '🍈 メロン', desc: 'スキル: 爆弾網メロンネット', detail: '高級感あふれる網目模様のパワー系フルーツ。周囲に種をばらまく。' },
    peach: { name: '🍑 モモ', desc: 'スキル: 桃源郷バリア＆回復', detail: '優しく包み込むようなオーラで高得点ボーナスをもたらす幸運のモモ。' }
};

const enemyCharacters = [
    { name: '🍴 コックさん鬼', desc: 'スピード: 普通 / 脅威度: ★☆☆', detail: 'キッチンから脱走したフルーツたちを狙う最初のコック。フォークとナイフが武器。' },
    { name: '🔥 激辛シェフ鬼', desc: 'スピード: やや速い / 脅威度: ★★☆', detail: '怒ると足が速くなる熱血シェフ。執拗にフルーツを追い回す。' },
    { name: '⭐ 黄金グルメ鬼', desc: 'スピード: 高速 / 脅威度: ★★★', detail: '制限時間終盤に現れる最凶の鬼。捕まると一瞬で食べられてしまうので要注意。' }
];

let selectedChar = 'strawberry';
let zukanTab = 'ally';

function updateCharSelect() {
    charSelectGrid.innerHTML = '';
    Object.keys(allyCharacters).forEach(key => {
        let char = allyCharacters[key];
        let isUnlocked = saveData.unlocked.includes(key);
        let isSelected = selectedChar === key;

        let card = document.createElement('div');
        card.className = `char-card ${isSelected ? 'selected' : ''} ${!isUnlocked ? 'locked' : ''}`;
        card.innerHTML = `<h3>${char.name} ${isUnlocked ? '' : '🔒'}</h3><p>${char.desc}</p>`;
        if (isUnlocked) {
            card.addEventListener('click', () => {
                selectedChar = key;
                updateCharSelect();
            });
        }
        charSelectGrid.appendChild(card);
    });
    coinDisplay.textContent = saveData.coins;
}
updateCharSelect();

function renderZukan() {
    zukanContentList.innerHTML = '';
    if (zukanTab === 'ally') {
        Object.keys(allyCharacters).forEach(key => {
            let char = allyCharacters[key];
            let isUnlocked = saveData.unlocked.includes(key);
            let div = document.createElement('div');
            div.className = 'zukan-item';
            div.innerHTML = `
                <h4>${char.name} ${isUnlocked ? '' : '（未解放 🔒）'}</h4>
                <p><b>能力:</b> ${char.desc}</p>
                <p><b>解説:</b> ${isUnlocked ? char.detail : 'ガチャで当てると詳細が解放されます！'}</p>
            `;
            zukanContentList.appendChild(div);
        });
    } else {
        enemyCharacters.forEach(enemy => {
            let div = document.createElement('div');
            div.className = 'zukan-item';
            div.style.borderLeftColor = '#e67e22';
            div.innerHTML = `
                <h4>${enemy.name}</h4>
                <p><b>特徴:</b> ${enemy.desc}</p>
                <p><b>解説:</b> ${enemy.detail}</p>
            `;
            zukanContentList.appendChild(div);
        });
    }
}

tabAlly.addEventListener('click', () => { tabAlly.classList.add('active'); tabEnemy.classList.remove('active'); zukanTab = 'ally'; renderZukan(); });
tabEnemy.addEventListener('click', () => { tabEnemy.classList.add('active'); tabAlly.classList.remove('active'); zukanTab = 'enemy'; renderZukan(); });

openZukanBtn.addEventListener('click', () => { startScreen.style.display = 'none'; zukanScreen.style.display = 'flex'; renderZukan(); });
closeZukanBtn.addEventListener('click', () => { zukanScreen.style.display = 'none'; startScreen.style.display = 'flex'; updateCharSelect(); });
gameOverZukanBtn.addEventListener('click', () => { gameoverScreen.style.display = 'none'; zukanScreen.style.display = 'flex'; renderZukan(); });

openGachaBtn.addEventListener('click', () => { startScreen.style.display = 'none'; gachaScreen.style.display = 'flex'; gachaResult.textContent = '何が出るかな…？'; });
closeGachaBtn.addEventListener('click', () => { gachaScreen.style.display = 'none'; startScreen.style.display = 'flex'; updateCharSelect(); });
gameOverGachaBtn.addEventListener('click', () => { gameoverScreen.style.display = 'none'; gachaScreen.style.display = 'flex'; gachaResult.textContent = '何が出るかな…？'; });

spinGachaBtn.addEventListener('click', () => {
    if (saveData.coins < 100) {
        gachaResult.textContent = 'コインが足りないよ！（あと ' + (100 - saveData.coins) + '枚）';
        return;
    }
    saveData.coins -= 100;
    saveGame();
    coinDisplay.textContent = saveData.coins;

    let allKeys = Object.keys(allyCharacters);
    let lockedKeys = allKeys.filter(k => !saveData.unlocked.includes(k));

    let gotKey;
    if (lockedKeys.length > 0) {
        gotKey = lockedKeys[Math.floor(Math.random() * lockedKeys.length)];
        saveData.unlocked.push(gotKey);
        saveGame();
        gachaResult.innerHTML = `🎉 新キャラ【 ${allyCharacters[gotKey].name} 】GET! 🎉`;
    } else {
        saveData.coins += 150;
        saveGame();
        gachaResult.innerHTML = `⭐ 全部所持済み！ボーナスで150コイン返却！`;
    }
    updateCharSelect();
});

let gameState = 'START';
let gameTime = 0, score = 0, earnedCoins = 0;
let timerInterval = null, keys = {};
let player = { x: 400, y: 250, radius: 20, speed: 4.5, skillCdTimer: 0, isShielding: false, shieldTimer: 0, isSplit: false, splitTimer: 0, clones: [] };
let oni = { x: 100, y: 100, radius: 24, speed: 2.5, stunTimer: 0 };
let seeds = [], traps = [], items = [];

let activeTouchId = null;
let targetX = 400, targetY = 250;

// キャンバス内での指スライド移動（他の指のタッチと干渉しないよう識別）
canvas.addEventListener('pointerdown', (e) => {
    if (activeTouchId === null) {
        activeTouchId = e.pointerId;
        const rect = canvas.getBoundingClientRect();
        targetX = (e.clientX - rect.left) * (canvas.width / rect.width);
        targetY = (e.clientY - rect.top) * (canvas.height / rect.height);
    }
});
canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId === activeTouchId) {
        const rect = canvas.getBoundingClientRect();
        targetX = (e.clientX - rect.left) * (canvas.width / rect.width);
        targetY = (e.clientY - rect.top) * (canvas.height / rect.height);
    }
});
canvas.addEventListener('pointerup', (e) => {
    if (e.pointerId === activeTouchId) activeTouchId = null;
});
canvas.addEventListener('pointercancel', (e) => {
    if (e.pointerId === activeTouchId) activeTouchId = null;
});

// スキルボタン専用タップ処理（移動中の指とは別に独立して押せる）
mobileSkillBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gameState === 'PLAYING') useSkill();
});

window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
        e.preventDefault();
    }
    keys[e.code] = true;
    if (e.code === 'Space' && gameState === 'PLAYING') useSkill();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function useSkill() {
    if (player.skillCdTimer > 0) return;
    if (selectedChar === 'strawberry') {
        player.isShielding = true; player.shieldTimer = 90;
        for (let i = -1; i <= 1; i++) {
            let angle = Math.atan2(oni.y - player.y, oni.x - player.x) + (i * 0.3);
            seeds.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7, radius: 5 });
        }
        player.skillCdTimer = 240;
    } else if (selectedChar === 'grape') {
        player.isSplit = true; player.splitTimer = 180; player.clones = [];
        for (let i = 0; i < 4; i++) {
            let angle = (Math.PI * 2 / 4) * i;
            player.clones.push({ x: player.x + Math.cos(angle) * 40, y: player.y + Math.sin(angle) * 40, angleOffset: angle });
        }
        player.skillCdTimer = 300;
    } else if (selectedChar === 'watermelon') {
        player.isShielding = true; player.shieldTimer = 120;
        traps.push({ x: player.x, y: player.y, radius: 15, type: 'watermelon_seed' });
        player.skillCdTimer = 270;
    } else if (selectedChar === 'banana') {
        traps.push({ x: player.x, y: player.y, radius: 14, type: 'banana_peel' });
        player.speed = 7;
        setTimeout(() => { player.speed = 4.5; }, 1500);
        player.skillCdTimer = 200;
    } else if (selectedChar === 'melon') {
        player.isShielding = true; player.shieldTimer = 150;
        for (let i = 0; i < 6; i++) {
            let angle = (Math.PI * 2 / 6) * i;
            seeds.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6, radius: 6 });
        }
        player.skillCdTimer = 320;
    } else if (selectedChar === 'peach') {
        player.isShielding = true; player.shieldTimer = 180;
        score += 200;
        player.skillCdTimer = 300;
    }
}

startBtn.addEventListener('click', () => { startScreen.style.display = 'none'; canvas.focus(); initGame(); });
restartBtn.addEventListener('click', () => { gameoverScreen.style.display = 'none'; canvas.focus(); initGame(); });

function initGame() {
    gameState = 'PLAYING'; gameTime = 0; score = 0; earnedCoins = 0;
    player.x = 400; player.y = 250; player.speed = 4.5; player.skillCdTimer = 0;
    player.isShielding = false; player.shieldTimer = 0; player.isSplit = false; player.splitTimer = 0; player.clones = [];
    targetX = player.x; targetY = player.y; activeTouchId = null;
    oni.x = 100; oni.y = 100; oni.stunTimer = 0; oni.speed = 2.5;
    seeds = []; traps = []; items = [];
    spawnItem(); spawnItem();

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameState === 'PLAYING') {
            gameTime++; score += 10;
            if (gameTime % 5 === 0) earnedCoins += 1;
            timeDisplay.textContent = gameTime;
            scoreDisplay.textContent = score;
            coinDisplay.textContent = saveData.coins + earnedCoins;
            if (gameTime % 10 === 0 && oni.speed < 5.5) oni.speed += 0.1;
            if (Math.random() < 0.4) spawnItem();
        }
    }, 1000);
}

function spawnItem() {
    items.push({ x: Math.random() * (canvas.width - 60) + 30, y: Math.random() * (canvas.height - 60) + 30, radius: 12, type: Math.random() < 0.25 ? 'coin' : 'star' });
}

function update() {
    if (gameState !== 'PLAYING') return;

    let moveX = 0, moveY = 0;
    if (keys['ArrowUp'] || keys['KeyW']) moveY -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) moveY += 1;
    if (keys['ArrowLeft'] || keys['KeyA']) moveX -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) moveX += 1;

    if (moveX !== 0 || moveY !== 0) {
        if (moveX !== 0 && moveY !== 0) { moveX *= 0.7071; moveY *= 0.7071; }
        player.x += moveX * player.speed;
        player.y += moveY * player.speed;
        targetX = player.x;
        targetY = player.y;
    } else if (activeTouchId !== null) {
        let dx = targetX - player.x;
        let dy = targetY - player.y;
        let dist = Math.hypot(dx, dy);
        if (dist > 2) {
            player.x += (dx / dist) * Math.min(player.speed, dist);
            player.y += (dy / dist) * Math.min(player.speed, dist);
        }
    }

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    if (player.skillCdTimer > 0) player.skillCdTimer--;
    if (player.isShielding) { player.shieldTimer--; if (player.shieldTimer <= 0) player.isShielding = false; }
    if (player.isSplit) {
        player.splitTimer--;
        player.clones.forEach(clone => {
            clone.angleOffset += 0.08;
            clone.x = player.x + Math.cos(clone.angleOffset) * 50;
            clone.y = player.y + Math.sin(clone.angleOffset) * 50;
        });
        if (player.splitTimer <= 0) player.isSplit = false;
    }

    if (player.skillCdTimer <= 0) { skillCdDisplay.textContent = 'OK! [ボタン]'; skillCdDisplay.style.color = '#7bed9f'; }
    else { skillCdDisplay.textContent = (player.skillCdTimer / 60).toFixed(1) + '秒'; skillCdDisplay.style.color = '#ffa502'; }

    let otX = player.x, otY = player.y;
    if (player.isSplit && player.clones.length > 0 && Math.random() < 0.3) {
        let rc = player.clones[Math.floor(Math.random() * player.clones.length)];
        otX = rc.x; otY = rc.y;
    }
    let angleToPlayer = Math.atan2(otY - oni.y, otX - oni.x);
    let currentOniSpeed = oni.speed;
    if (oni.stunTimer > 0) { oni.stunTimer--; currentOniSpeed *= 0.3; }
    oni.x += Math.cos(angleToPlayer) * currentOniSpeed;
    oni.y += Math.sin(angleToPlayer) * currentOniSpeed;

    for (let i = traps.length - 1; i >= 0; i--) {
        let t = traps[i];
        if (Math.hypot(t.x - oni.x, t.y - oni.y) < oni.radius + t.radius) {
            oni.stunTimer = t.type === 'banana_peel' ? 120 : 90;
            traps.splice(i, 1); score += 40;
        }
    }
    for (let i = seeds.length - 1; i >= 0; i--) {
        let s = seeds[i]; s.x += s.vx; s.y += s.vy;
        if (Math.hypot(s.x - oni.x, s.y - oni.y) < oni.radius + s.radius) {
            oni.stunTimer = 60; seeds.splice(i, 1); score += 50; continue;
        }
        if (s.x < 0 || s.x > canvas.width || s.y < 0 || s.y > canvas.height) seeds.splice(i, 1);
    }
    for (let i = items.length - 1; i >= 0; i--) {
        let itm = items[i];
        if (Math.hypot(player.x - itm.x, player.y - itm.y) < player.radius + itm.radius) {
            if (itm.type === 'coin') earnedCoins += 3;
            else score += itm.type === 'star' ? 300 : 100;
            coinDisplay.textContent = saveData.coins + earnedCoins;
            items.splice(i, 1);
        }
    }
    if (Math.hypot(player.x - oni.x, player.y - oni.y) < player.radius + oni.radius) {
        if (player.isShielding) {
            oni.x -= Math.cos(angleToPlayer) * 60; oni.y -= Math.sin(angleToPlayer) * 60;
        } else if (!player.isSplit) {
            gameOver();
        }
    }
}

function gameOver() {
    gameState = 'GAMEOVER'; clearInterval(timerInterval);
    saveData.coins += earnedCoins;
    saveGame();
    resultText.innerHTML = `生存時間: <b>${gameTime}</b> 秒<br>獲得コイン: <b style="color:#f1c40f">+${earnedCoins}枚</b><br>最終スコア: <b>${score}</b> 点`;
    gameoverScreen.style.display = 'flex';
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2;
    for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
    for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

    traps.forEach(t => {
        ctx.save(); ctx.translate(t.x, t.y);
        if (t.type === 'banana_peel') { ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🍌', 0, 8); }
        else { ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill(); }
        ctx.restore();
    });

    items.forEach(itm => {
        ctx.beginPath(); ctx.arc(itm.x, itm.y, itm.radius, 0, Math.PI * 2);
        if (itm.type === 'coin') {
            ctx.fillStyle = '#f1c40f'; ctx.fill(); ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('©', 0, 4);
        } else {
            ctx.fillStyle = itm.type === 'star' ? '#f1c40f' : '#ffffff'; ctx.fill();
            ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.stroke();
        }
    });

    seeds.forEach(s => {
        ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e74c3c'; ctx.fill();
    });

    ctx.save(); ctx.translate(oni.x, oni.y);
    ctx.beginPath(); ctx.arc(0, 0, oni.radius, 0, Math.PI * 2);
    ctx.fillStyle = oni.stunTimer > 0 ? '#3498db' : '#e67e22'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#d35400'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(-12, -oni.radius - 16, 24, 16);
    ctx.beginPath(); ctx.arc(0, -oni.radius - 16, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🍴', 0, 6);
    ctx.restore();

    if (selectedChar === 'strawberry') drawStrawberry(player.x, player.y, player.radius, player.isShielding);
    else if (selectedChar === 'grape') {
        if (player.isSplit) player.clones.forEach(c => drawGrape(c.x, c.y, player.radius * 0.8, true));
        drawGrape(player.x, player.y, player.radius, player.isSplit);
    } else if (selectedChar === 'watermelon') drawWatermelon(player.x, player.y, player.radius + 4, player.isShielding);
    else if (selectedChar === 'banana') drawBanana(player.x, player.y, player.radius);
    else if (selectedChar === 'melon') drawMelon(player.x, player.y, player.radius + 4, player.isShielding);
    else if (selectedChar === 'peach') drawPeach(player.x, player.y, player.radius + 2, player.isShielding);

    requestAnimationFrame(gameLoop);
}

function drawStrawberry(x, y, radius, isShielding) {
    ctx.save(); ctx.translate(x, y);
    if (isShielding) { ctx.beginPath(); ctx.arc(0, 0, radius + 12, 0, Math.PI * 2); ctx.fillStyle = 'rgba(46, 204, 113, 0.4)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#2ecc71'; ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(0, radius);
    ctx.bezierCurveTo(-radius, radius * 0.5, -radius, -radius * 0.5, 0, -radius);
    ctx.bezierCurveTo(radius, -radius * 0.5, radius, radius * 0.5, 0, radius);
    ctx.fillStyle = '#ff4757'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#c0392b'; ctx.stroke();
    ctx.fillStyle = '#f1c40f';
    for (let i = -1; i <= 1; i++) { ctx.fillRect(i * 6, -5, 3, 3); ctx.fillRect(i * 8, 5, 3, 3); }
    ctx.fillStyle = '#2ed573';
    ctx.beginPath(); ctx.moveTo(0, -radius); ctx.lineTo(-10, -radius - 8); ctx.lineTo(-3, -radius - 3); ctx.lineTo(0, -radius - 10); ctx.lineTo(3, -radius - 3); ctx.lineTo(10, -radius - 8); ctx.closePath(); ctx.fill();
    ctx.restore();
}

function drawGrape(x, y, radius, isGhost) {
    ctx.save(); ctx.translate(x, y);
    if (isGhost) ctx.globalAlpha = 0.6;
    const offsets = [{ox: 0, oy: -8}, {ox: -8, oy: 0}, {ox: 8, oy: 0}, {ox: -14, oy: 8}, {ox: 0, oy: 8}, {ox: 14, oy: 8}, {ox: -6, oy: 16}, {ox: 6, oy: 16}];
    offsets.forEach(o => {
        ctx.beginPath(); ctx.arc(o.ox, o.oy, radius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = '#9b59b6'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#8e44ad'; ctx.stroke();
    });
    ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, -20); ctx.stroke();
    ctx.restore();
}

function drawWatermelon(x, y, radius, isShielding) {
    ctx.save(); ctx.translate(x, y);
    if (isShielding) { ctx.beginPath(); ctx.arc(0, 0, radius + 10, 0, Math.PI * 2); ctx.fillStyle = 'rgba(52, 152, 219, 0.4)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#3498db'; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fillStyle = '#2ecc71'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#27ae60'; ctx.stroke();
    ctx.strokeStyle = '#1e8449'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, radius, -Math.PI*0.3, Math.PI*0.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, radius, Math.PI*0.7, Math.PI*1.3); ctx.stroke();
    ctx.restore();
}

function drawBanana(x, y, radius) {
    ctx.save(); ctx.translate(x, y);
    ctx.font = '28px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍌', 0, 0); ctx.restore();
}

function drawMelon(x, y, radius, isShielding) {
    ctx.save(); ctx.translate(x, y);
    if (isShielding) { ctx.beginPath(); ctx.arc(0, 0, radius + 10, 0, Math.PI * 2); ctx.fillStyle = 'rgba(241, 196, 15, 0.4)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#f1c40f'; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fillStyle = '#a9dfbf'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#27ae60'; ctx.stroke();
    ctx.restore();
}

function drawPeach(x, y, radius, isShielding) {
    ctx.save(); ctx.translate(x, y);
    if (isShielding) { ctx.beginPath(); ctx.arc(0, 0, radius + 10, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 154, 162, 0.5)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#ff6b81'; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fillStyle = '#ffb7b2'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#ff9aa2'; ctx.stroke();
    ctx.restore();
}

function gameLoop() { update(); draw(); }
draw();
</script>
